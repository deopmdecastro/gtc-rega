; GTC Rega — Firmware ESP32-S3 (plataforma ES3N28P)
; Build:   pio run               (env padrão = esp32-s3-devkitc-1)
; Upload:  pio run -t upload
; Monitor: pio device monitor
;
; !! IMPORTANTE: o env padrão já define -D WOKWI_SIM para que o firmware
; seja EXECUTÁVEL também no simulador Wokwi. A detecção do simulador é
; feita em runtime (tentativa de ligação à rede virtual "Wokwi-GUEST").
; Não há mais um env separado — apenas um binário serve hardware real
; ou simulação. Para desativar WOKWI_SIM num firmware de produção crie
; um env que herda deste sem esse define.

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_build.filesystem = littlefs

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=2
    -D WOKWI_SIM=1

lib_deps =
    ; JSON (telemetria / API)
    bblanchon/ArduinoJson@^7.2.0
    ; Sensores de temperatura/humidade DHT22 (IO21/IO14)
    adafruit/DHT sensor library@^1.4.6
    ; Wi-Fi: portal de configuracao (AP + captive portal) sem recompilar
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    ; Servidor web assincrono no ESP32 — serve a interface GTC e a API local
    esp32async/ESPAsyncWebServer@^3.6.0
    esp32async/AsyncTCP@^3.3.2
    ; Descoberta na rede: http://gtc-rega.local
    ESPmDNS
    ; Sistema de ficheiros para a interface web (data/ -> LittleFS)
    LittleFS
    ; Bluetooth Low Energy: scan/pairing de dispositivos e provisionamento
    h2zero/NimBLE-Arduino@^1.4.1

; Ambiente só para simulação no Wokwi (VS Code). Igual ao env padrão. Mantido
; apenas para retro-compatibilidade com diagramas wokwi antigos que procurem
; explicitamente o nome "esp32-s3-wokwi". Compila com:
;   pio run -e esp32-s3-wokwi
[env:esp32-s3-wokwi]
extends = env:esp32-s3-devkitc-1
