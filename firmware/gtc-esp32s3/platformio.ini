; GTC Rega — Firmware ESP32-S3
; Build:   pio run
; Upload:  pio run -t upload
; Monitor: pio device monitor

[env:esp32-s3-devkitc-1]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = default_8MB.csv
board_build.flash_mode = qio
board_build.filesystem = littlefs

build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=2

lib_deps =
    ; JSON (telemetria / API)
    bblanchon/ArduinoJson@^7.2.0
    ; Wi-Fi: portal de configuracao (AP + captive portal) sem recompilar
    https://github.com/tzapu/WiFiManager.git#v2.0.17
    ; Servidor web assincrono no ESP32 — serve a interface GTC e a API local
    esp32async/ESPAsyncWebServer@^3.6.0
    esp32async/AsyncTCP@^3.3.2
    ; Descoberta na rede: http://gtc-rega.local
    ESPmDNS
    ; Sistema de ficheiros para a interface web (data/ -> LittleFS)
    LittleFS
    ; Bluetooth Low Energy: scan/pairing de dispositivos e provisionamento
    ; alternativo ao portal Wi-Fi (stack mais leve em RAM que o BLE nativo)
    h2zero/NimBLE-Arduino@^1.4.1

; Ambiente só para simulação no Wokwi (VS Code). Igual ao env real, mas
; com -D WOKWI_SIM que faz o firmware ligar direto à rede virtual
; "Wokwi-GUEST" em vez de esperar pelo portal cativo do WiFiManager
; (inacessível dentro do simulador). Não usar para gravar na placa real.
[env:esp32-s3-wokwi]
extends = env:esp32-s3-devkitc-1
build_flags =
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=2
    -D WOKWI_SIM=1
