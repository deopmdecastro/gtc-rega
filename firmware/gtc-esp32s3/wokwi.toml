[wokwi]
version = 1
# A extensão Wokwi procura o firmware.bin em .pio/build/<env>/. O env default
# é esp32-s3-devkitc-1 (que já inclui WOKWI_SIM=1 e define o isWokwiSim em
# runtime). Se você compilar com `pio run -e esp32-s3-wokwi` o caminho muda.
#
# ⚠️ IMPORTANTE — SIMULADOR CINZENTO / SEM RENDERIZAR
# O simulador Wokwi só desenha os componentes DEPOIS que consegue carregar
# um firmware.bin válido no caminho abaixo. Se o diagrama aparece TODO
# CINZA / sem power-up é porque o binário ainda não foi compilado.
# Compile antes de iniciar a simulação:
#     cd firmware/gtc-esp32s3
#     pio run                       # gera .pio/build/esp32-s3-devkitc-1/firmware.bin
#     # depois carregue no ▶ Start Simulation dentro do diagram.json
firmware = '.pio/build/esp32-s3-devkitc-1/firmware.bin'
elf     = '.pio/build/esp32-s3-devkitc-1/firmware.elf'

# Compilar antes de iniciar o simulador:
#   pio run                          # gera esp32-s3-devkitc-1/firmware.bin
#   pio run -t upload                # grava na placa real
#
# A firmware detecta automaticamente o simulador (tentativa de ligação à
# rede virtual "Wokwi-GUEST") e ativa o espelho MCP23017 -> GPIO 4..12/13/15
# para que LEDs/relés/switches do diagram.json sejam operados em tempo real.
# Em hardware real entra no portal cativo WiFiManager (AP "GTC-Rega-Setup").
#
# Botões manuais (Wokwi): START=GPIO38, STOP=GPIO39, RESET=GPIO40, AUTO=GPIO41
# (evita GPIO 33..37 que são reservados para PSRAM em variantes N8R8/N16R8V).

