<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060b10" />
    <meta name="description" content="GTC — Sistema de Rega Automatizada para ESP32-S3" />
    <title>GTC — Sistema de Rega Automatizada</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: radial-gradient(circle at 50% 40%, rgba(0,190,190,.07), transparent 50%), #060b10;
        transition: opacity .5s ease, visibility .5s ease;
      }
      #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
      .splash-logo {
        width: 64px; height: 64px;
        display: grid; place-items: center;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      .splash-logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
      .splash-title { font-family: 'Manrope', system-ui, sans-serif; font-weight: 800; font-size: 20px; letter-spacing: .12em; color: #eef3f4; }
      .splash-sub { font-family: 'Manrope', system-ui, sans-serif; font-size: 9px; letter-spacing: .22em; color: #526875; text-transform: uppercase; }
      .splash-bar { width: 140px; height: 3px; border-radius: 99px; background: #17232c; overflow: hidden; }
      .splash-bar span { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #0cb4aa, #19dfd5); animation: splash-load 1.6s ease forwards; }
      @keyframes splash-pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(20,221,214,.3); } 50% { box-shadow: 0 0 0 10px rgba(20,221,214,0); } }
      @keyframes splash-load { from { width: 0; } to { width: 100%; } }
      /* Splash ainda mais compacto no target HMI 320×240 */
      @media (max-height: 260px) and (orientation: landscape) {
        #splash { gap: 10px; }
        .splash-logo { width: 44px; height: 44px; }
        .splash-title { font-size: 15px; letter-spacing: .1em; }
        .splash-sub { font-size: 8px; letter-spacing: .18em; }
        .splash-bar { width: 110px; height: 2px; }
      }
      @media (max-width: 260px) {
        #splash { gap: 12px; }
        .splash-logo { width: 48px; height: 48px; }
        .splash-title { font-size: 17px; }
        .splash-sub { font-size: 8px; }
        .splash-bar { width: 120px; }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-logo">
        <img src="/apple-touch-icon.png" alt="GTC Rega" width="180" height="170" />
      </div>
      <div style="text-align:center">
        <div class="splash-title">GTC REGA</div>
        <div class="splash-sub">Sistema de Rega Automatizada</div>
      </div>
      <div class="splash-bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      window.addEventListener('load', function() {
        setTimeout(function() {
          var s = document.getElementById('splash');
          if (s) s.classList.add('hidden');
          setTimeout(function() { if (s) s.remove(); }, 600);
        }, 1700);
      });
    </script>
  </body>
</html>
