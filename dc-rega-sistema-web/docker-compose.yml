services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - gtc_data:/data
    environment:
      - DATA_DIR=/data
      - PORT=3000
      - DEVICE_TOKEN=${DEVICE_TOKEN:-}

  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  gtc_data:
