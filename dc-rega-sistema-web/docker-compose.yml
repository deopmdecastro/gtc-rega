version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - gtc_data:/data
    environment:
      - DATA_DIR=/data
      - PORT=3000

  frontend:
    build: .
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://backend:3000

volumes:
  gtc_data:
